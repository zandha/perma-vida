body{margin:0;background:#0E1A10}
.al-root{position:relative;width:100%;height:100vh;min-height:720px;box-sizing:border-box;padding:48px 64px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font-family:Inter,system-ui,sans-serif;color:#F4F1E8;background:#0E1A10 var(--al-photo) 50% 50%/cover no-repeat}
.al-brand{position:absolute;top:28px;left:32px;display:flex;align-items:flex-start;gap:14px;padding:18px 26px 14px 18px;border-radius:18px;background:#0B0B0B;border-bottom:5px solid #F07D2E}
.al-logo{width:80px;height:80px;display:block}
.al-brandtext{display:flex;flex-direction:column;padding-top:2px}
.al-word{font-family:'Nanum Brush Script',cursive;font-size:66px;line-height:.82;color:#FFFFFF;-webkit-text-stroke:.035em #FFFFFF}
.al-tag{margin-top:8px;font-family:'Baloo 2',sans-serif;font-style:italic;font-weight:600;font-size:20px;line-height:1;letter-spacing:.02em;color:#FFC61A;white-space:nowrap}
.al-panel{max-width:480px;box-sizing:border-box;padding:40px 40px 36px;border-radius:20px;background:rgba(14,26,16,.86);display:flex;flex-direction:column;gap:18px}
.al-eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#F07D2E}
.al-h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:56px;line-height:1;letter-spacing:-.01em}
.al-copy{margin:0;font-size:18px;line-height:1.55;color:#D9D4C5}
.al-domain{color:#FFC61A;font-weight:600}
@media (max-width:820px),(max-aspect-ratio:1/1){
.al-root{height:auto;min-height:100vh;justify-content:flex-start;align-items:center;padding:62vw 16px 16px;background:linear-gradient(to bottom,rgba(14,26,16,0) 0,rgba(14,26,16,0) 52vw,#0E1A10 78vw) no-repeat,#0E1A10 var(--al-photo) 15% -15vw/140% auto no-repeat}
.al-brand{top:14px;left:14px;gap:9px;padding:12px 16px 9px 12px;border-radius:12px;border-bottom-width:4px}
.al-logo{width:52px;height:52px}
.al-word{font-size:43px}
.al-tag{margin-top:5px;font-size:13px}
.al-panel{max-width:640px;width:100%;padding:26px;gap:14px}
.al-h1{font-size:38px}
.al-copy{font-size:16px}
}
